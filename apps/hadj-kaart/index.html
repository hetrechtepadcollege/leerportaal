<!DOCTYPE html>
<html lang="nl" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self'; img-src 'self' data: https://cdnjs.cloudflare.com https://*.tile.openstreetmap.org; connect-src 'self';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Hadj Routekaart | Het Rechte Pad College</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://leer.hetrechtepadcollege.nl/apps/hadj-kaart/">
<meta property="og:title" content="Hadj Routekaart | Het Rechte Pad College">
<meta property="og:description" content="Interactieve kaart van de heilige plaatsen en rituelen van de hadj — van Miqāt tot Ṭawāf al-Wadāʿ.">
<meta property="og:image" content="https://leer.hetrechtepadcollege.nl/images/share-banner.png">
<meta name="description" content="Interactieve kaart van de heilige plaatsen en rituelen van de hadj — van Miqāt tot Ṭawāf al-Wadāʿ.">
<link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loading">
  <div class="loading-kaaba">🕋</div>
  <div class="loading-text">Kaart wordt geladen...</div>
  <div class="loading-bar"><div class="loading-fill"></div></div>
</div>

<header>
  <a href="../../" class="header-logo-link">
    <img src="../../images/HRPC-logo.webp" class="header-logo" alt="HRPC">
  </a>
  <div class="header-title">
    <h1>Hadj Routekaart</h1>
    <div class="arabic">مناسك الحج</div>
  </div>
  <div class="route-toggle">
    <button class="route-btn active" data-route="true">Route</button>
    <button class="route-btn" data-route="false">Vrij</button>
  </div>
</header>

<div id="map"></div>

<div id="day-nav">
  <button class="day-btn active" data-day="all">Alle locaties</button>
  <button class="day-btn" data-day="0">Vóór Hadj</button>
  <button class="day-btn" data-day="8">8 Dhul Hijjah</button>
  <button class="day-btn" data-day="9">9 Dhul Hijjah — ʿArafāt</button>
  <button class="day-btn" data-day="10">10 Dhul Hijjah — ʿĪd</button>
  <button class="day-btn" data-day="11">11–13 Dhul Hijjah</button>
</div>

<div id="info-panel">
  <div class="panel-handle"></div>
  <div class="panel-header">
    <div class="panel-title-group">
      <div class="panel-cat" id="panel-cat"></div>
      <div class="panel-name" id="panel-name"></div>
      <div class="panel-arabic" id="panel-arabic"></div>
    </div>
    <button class="panel-close" aria-label="Sluiten">✕</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
