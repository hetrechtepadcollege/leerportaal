<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profeten in de Koran | Het Rechte Pad College</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
    <a href="../../" class="header-logo-link" title="Terug naar Leerportaal"><img src="../../images/HRPC-logo.png" alt="Het Rechte Pad College" class="header-logo"></a>
    <h1 class="header-title">Profeten in de Koran</h1>
    <p class="header-subtitle">Ontdek de 25 profeten die worden genoemd in de Koran</p>
</header>

<main class="page-shell">

    <section class="jump-section">
        <p class="jump-label">Spring naar profeet</p>
        <div class="jump-row" id="jump-row"></div>
    </section>

    <section class="timeline-stage">
        <div class="timeline-line" aria-hidden="true"></div>
        <div class="timeline-container" id="timeline" aria-label="Verticale tijdlijn van Koranische profeten"></div>
    </section>

</main>

<div class="portal-home-wrap">
    <a href="https://leer.hetrechtepadcollege.nl/" class="portal-home-btn">
        Terug naar Leerportaal
    </a>
</div>

<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-panel">
        <button class="close" id="modal-close" aria-label="Sluiten">&times;</button>
        <p id="modal-period" class="period-badge"></p>
        <p id="modal-arabic" class="arabic-name"></p>
        <h2 id="modal-title"></h2>
        <p id="modal-description" class="modal-description"></p>
        <figure class="media-block" id="image-wrap"></figure>
        <div class="media-block" id="video-wrap"></div>
        <div id="quran-refs" class="quran-refs"></div>
    </div>
</div>

<script src="script.js"></script>
<script data-goatcounter="https://hetrechtepadcollege.goatcounter.com/count"
    async src="//gc.zgo.at/count.js"></script>
</body>
</html>
