<body>

<header class="app-header">
    <a href="../../" class="header-logo-link" title="Terug naar Leerportaal"><img src="../../images/HRPC-logo.webp" alt="Het Rechte Pad College" class="header-logo"></a>

<main class="page-shell">

    <section class="timeline-stage">

        <p id="modal-arabic" class="arabic-name"></p>
        <h2 id="modal-title"></h2>
        <p id="modal-description" class="modal-description"></p>
        <figure class="media-block" id="image-wrap"></figure>
        <div class="media-block" id="video-wrap"></div>

<script src="script.js"></script>
