<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dzikr App Preview – HRPC Leerportaal</title>
    <link rel="stylesheet" href="../../fonts/fonts.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Design tokens (exact match to app) ─────────────────── */
:root {
  --blue:         #1f294d;
  --blue-soft:    rgba(31,41,77,0.06);
  --blue-border:  rgba(31,41,77,0.10);
  --gold:         #d4af37;
  --gold-soft:    rgba(212,175,55,0.10);
  --gold-border:  rgba(212,175,55,0.28);
  --bg:           #f9f8f6;
  --surface:      #ffffff;
  --text:         #1c2340;
  --muted:        #5c6e8a;
  --border:       rgba(31,41,77,0.09);
  --shadow:       0 1px 4px rgba(31,41,77,0.06), 0 4px 16px rgba(31,41,77,0.07);
  --shadow-hover: 0 8px 28px rgba(31,41,77,0.14);
}

body {
  background: var(--bg);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Inter', sans-serif;
}

/* ── Phone frame ─────────────────────────────────────────── */
.phone {
  width: 320px;
  height: 660px;
  background: var(--bg);
  border-radius: 44px;
  box-shadow:
    0 0 0 1px rgba(31,41,77,0.12),
    0 0 0 8px rgba(31,41,77,0.06),
    0 40px 80px rgba(31,41,77,0.22);
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* ── Status bar ──────────────────────────────────────────── */
.status-bar {
  background: var(--bg);
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  flex-shrink: 0;
}
.status-time {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.2px;
}
.status-icons { display: flex; gap: 6px; align-items: center; }

/* ── App header (compact, matches app-header pattern) ─────── */
.app-header {
  background: var(--bg);
  padding: 0 20px 14px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.header-badge {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 2px;
}
.header-title {
  font-family: 'Newsreader', serif;
  font-size: 24px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.04em;
  line-height: 1;
}
.header-arabic-inline {
  font-family: 'Noto Naskh Arabic', serif;
  font-size: 18px;
  color: var(--gold);
  margin-left: 8px;
  vertical-align: middle;
}

/* ── Tasbih view content ─────────────────────────────────── */
.tasbih-container {
  flex: 1;
  overflow: hidden;
  background: var(--surface);
  margin: 14px 16px 80px;
  border-radius: 14px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 14px 14px;
  gap: 12px;
}

/* ── Selector ────────────────────────────────────────────── */
.tasbih-selector {
  display: flex;
  gap: 6px;
  flex-wrap: nowrap;
  overflow: hidden;
  width: 100%;
  justify-content: center;
}
.tasbih-type-btn {
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 600;
  white-space: nowrap;
  cursor: default;
  transition: all 0.3s ease;
}
.tasbih-type-btn.active {
  background: var(--blue);
  border-color: var(--blue);
  color: #ffffff;
}

/* ── Bead circle ─────────────────────────────────────────── */
.tasbih-circle-wrap {
  position: relative;
  width: 200px;
  height: 200px;
  flex-shrink: 0;
}
.tasbih-circle {
  position: absolute;
  inset: 0;
}
.tasbih-bead {
  position: absolute;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #f0eee9;
  border: 1.5px solid rgba(31,41,77,0.16);
  transform: translate(-50%, -50%);
  transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}
.tasbih-bead.completed {
  background: var(--gold);
  border-color: #b8941e;
  box-shadow: 0 0 0 3px rgba(212,175,55,0.13);
}
.tasbih-bead.current {
  background: var(--gold);
  border-color: #b8941e;
  box-shadow: 0 0 0 4px rgba(212,175,55,0.25);
  animation: beadPulse 1.5s ease-in-out infinite;
}
@keyframes beadPulse {
  0%, 100% { box-shadow: 0 0 0 3px rgba(212,175,55,0.15); }
  50%       { box-shadow: 0 0 0 5px rgba(212,175,55,0.30); }
}
.tasbih-bead.milestone {
  width: 17px;
  height: 17px;
}

/* ── Center display ──────────────────────────────────────── */
.tasbih-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
  width: 120px;
}
.tasbih-center-arabic {
  font-family: 'Noto Naskh Arabic', serif;
  font-size: 16px;
  font-weight: 600;
  color: var(--blue);
  line-height: 1.8;
  direction: rtl;
  display: block;
  transition: opacity 0.3s ease;
}
.tasbih-center-count {
  font-family: 'Inter', sans-serif;
  font-size: 18px;
  font-weight: 800;
  color: var(--blue);
  display: block;
  transition: transform 0.15s ease;
  letter-spacing: -0.5px;
}
.tasbih-center-count.bump { transform: scale(1.2); }
.tasbih-center-rounds {
  font-size: 10px;
  color: var(--muted);
  display: block;
  margin-top: 2px;
}

/* ── Tap button (exactly as in app: rectangular, not circle) */
.tasbih-tap-btn {
  width: 100px;
  height: 44px;
  border-radius: 8px;
  border: 1px solid var(--blue);
  background: var(--blue);
  color: #ffffff;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: default;
  transition: all 0.12s ease;
  flex-shrink: 0;
  letter-spacing: -0.2px;
}
.tasbih-tap-btn.pressed {
  transform: scale(0.94);
  background: #17203d;
}

/* ── Controls ────────────────────────────────────────────── */
.tasbih-controls {
  display: flex;
  gap: 12px;
  align-items: center;
}
.tasbih-control-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 500;
  padding: 5px 10px;
  border-radius: 8px;
  cursor: default;
}

/* ── Celebration overlay ─────────────────────────────────── */
.celebration {
  position: absolute;
  inset: 14px 16px 80px;
  border-radius: 14px;
  background: rgba(31,41,77,0.72);
  backdrop-filter: blur(8px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  z-index: 10;
}
.celebration.show { opacity: 1; }
.celebration-title {
  font-family: 'Newsreader', serif;
  font-size: 22px;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: -0.5px;
}
.celebration-arabic {
  font-family: 'Noto Naskh Arabic', serif;
  font-size: 20px;
  color: var(--gold);
  direction: rtl;
}
.celebration-sub {
  font-size: 12px;
  color: rgba(255,255,255,0.6);
}
.celebration-check {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(212,175,55,0.15);
  border: 1.5px solid var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}

/* ── Tab bar (exact match: floating pill) ────────────────── */
.tab-bar {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 28px);
  height: 60px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: rgba(255,255,255,0.92);
  box-shadow: var(--shadow-hover);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 20;
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 0;
  background: none;
  border: none;
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  font-size: 9px;
  font-weight: 600;
  cursor: default;
}
.tab.active { color: var(--blue); }
.tab-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 22px;
}
</style>
</head>
<body>

<div class="phone">

  <!-- Status bar -->
  <div class="status-bar">
    <span class="status-time">09:41</span>
    <div class="status-icons">
      <!-- Signal -->
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
        <rect x="0"  y="5"  width="3" height="7" rx="1" fill="var(--text)" opacity=".9"/>
        <rect x="4.5" y="3" width="3" height="9" rx="1" fill="var(--text)" opacity=".9"/>
        <rect x="9"  y="1" width="3" height="11" rx="1" fill="var(--text)" opacity=".9"/>
        <rect x="13.5" y="0" width="3" height="12" rx="1" fill="var(--text)" opacity=".3"/>
      </svg>
      <!-- Battery -->
      <svg width="22" height="12" viewBox="0 0 22 12" fill="none">
        <rect x=".75" y=".75" width="18.5" height="10.5" rx="2.75" stroke="var(--text)" stroke-width="1.5" opacity=".35"/>
        <rect x="2" y="2" width="13" height="8" rx="1.5" fill="var(--text)" opacity=".9"/>
        <path d="M20.5 4.5v3" stroke="var(--text)" stroke-width="1.5" stroke-linecap="round" opacity=".4"/>
      </svg>
    </div>
  </div>

  <!-- App header -->
  <div class="app-header">
    <div class="header-badge">HRPC Leerportaal</div>
    <div>
      <span class="header-title">De Tuin van Dzikr</span>
      <span class="header-arabic-inline">ذِكْر</span>
    </div>
  </div>

  <!-- Tasbih view -->
  <div class="tasbih-container" id="tasbihContainer">

    <!-- Selector -->
    <div class="tasbih-selector">
      <button class="tasbih-type-btn active" id="btn0">SubḥānAllāh</button>
      <button class="tasbih-type-btn" id="btn1">Alḥamdulillāh</button>
      <button class="tasbih-type-btn" id="btn2">Allāhu Akbar</button>
    </div>

    <!-- Bead circle -->
    <div class="tasbih-circle-wrap">
      <div class="tasbih-circle" id="tasbihCircle"></div>
      <div class="tasbih-center">
        <span class="tasbih-center-arabic" id="centerArabic">سُبْحَانَ اللَّهِ</span>
        <span class="tasbih-center-count" id="centerCount">28 / 33</span>
        <span class="tasbih-center-rounds" id="centerRounds"></span>
      </div>
    </div>

    <!-- Tap button -->
    <button class="tasbih-tap-btn" id="tapBtn">Tap</button>

    <!-- Controls -->
    <div class="tasbih-controls">
      <button class="tasbih-control-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 1 3.2-6.8"/><path d="M3 2v5h5"/></svg>
        Reset
      </button>
      <button class="tasbih-control-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        Geluid
      </button>

  </div>

  <!-- Celebration overlay -->
  <div class="celebration" id="celebration">
    <div class="celebration-check">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12l5 5L19 7"/>
      </svg>
    </div>
    <div class="celebration-title" id="celebrationTitle">Voltooid</div>
    <div class="celebration-arabic" id="celebrationArabic">سُبْحَانَ اللَّهِ</div>
    <div class="celebration-sub" id="celebrationSub">33 × SubḥānAllāh</div>
  </div>

  <!-- Tab bar (floating pill, exact match) -->
  <nav class="tab-bar">
    <!-- Tuin -->
    <button class="tab">
      <span class="tab-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c-4-3-8-6-8-11a8 8 0 0 1 16 0c0 5-4 8-8 11z"/><circle cx="12" cy="11" r="3"/></svg>
      </span>
      Tuin
    </button>
    <!-- Tasbih (active) -->
    <button class="tab active">
      <span class="tab-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="5"  r="1.3" fill="currentColor"/><circle cx="17" cy="8"  r="1.3" fill="currentColor"/><circle cx="17" cy="14" r="1.3" fill="currentColor"/><circle cx="12" cy="19" r="1.3" fill="currentColor"/><circle cx="7"  cy="14" r="1.3" fill="currentColor"/><circle cx="7"  cy="8"  r="1.3" fill="currentColor"/></svg>
      </span>
      Tasbih
    </button>
    <!-- Patroon -->
    <button class="tab">
      <span class="tab-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>
      </span>
      Patroon
    </button>
    <!-- Stats -->
    <button class="tab">
      <span class="tab-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>
      </span>
      Stats
    </button>
  </nav>

</div>

<script>
/* ── Data ───────────────────────────────────────────────── */
const adhkar = [
  { arabic: 'سُبْحَانَ اللَّهِ', label: 'SubḥānAllāh',    target: 33, startAt: 28 },
  { arabic: 'اَلْحَمْدُ لِلَّهِ', label: 'Alḥamdulillāh', target: 33, startAt: 0  },
  { arabic: 'اَللَّهُ أَكْبَرُ',  label: 'Allāhu Akbar',   target: 34, startAt: 0  },
];

/* ── State ──────────────────────────────────────────────── */
let dhikrIndex = 0;
let count       = adhkar[0].startAt;
let animating   = false;
const BEADS     = 33;
const RADIUS    = 84; // px from center of 200px wrap

/* ── DOM ────────────────────────────────────────────────── */
const circle        = document.getElementById('tasbihCircle');
const centerArabic  = document.getElementById('centerArabic');
const centerCount   = document.getElementById('centerCount');
const centerRounds  = document.getElementById('centerRounds');
const tapBtn        = document.getElementById('tapBtn');
const celebration   = document.getElementById('celebration');
const celebTitle    = document.getElementById('celebrationTitle');
const celebArabic   = document.getElementById('celebrationArabic');
const celebSub      = document.getElementById('celebrationSub');
const selectorBtns  = [
  document.getElementById('btn0'),
  document.getElementById('btn1'),
  document.getElementById('btn2'),
];

/* ── Build bead ring ────────────────────────────────────── */
function buildBeads() {
  circle.innerHTML = '';
  const cx = 100, cy = 100; // center of 200×200 wrap
  for (let i = 0; i < BEADS; i++) {
    const angle = (i / BEADS) * 2 * Math.PI - Math.PI / 2;
    const x = cx + RADIUS * Math.cos(angle);
    const y = cy + RADIUS * Math.sin(angle);
    const bead = document.createElement('div');
    bead.className = 'tasbih-bead' + (i % 11 === 0 ? ' milestone' : '');
    bead.id = 'bead' + i;
    bead.style.left = x + 'px';
    bead.style.top  = y + 'px';
    circle.appendChild(bead);
  }
}

function updateBeads() {
  for (let i = 0; i < BEADS; i++) {
    const bead = document.getElementById('bead' + i);
    if (!bead) continue;
    bead.classList.remove('completed', 'current');
    if (i < count) bead.classList.add('completed');
    else if (i === count && count < adhkar[dhikrIndex].target) bead.classList.add('current');
  }
}

function updateCenter(d) {
  centerArabic.textContent = d.arabic;
  centerCount.textContent  = count + ' / ' + d.target;
  centerRounds.textContent = '';
}

function updateSelector(index) {
  selectorBtns.forEach((b, i) => {
    b.classList.toggle('active', i === index);
  });
}

function bumpCount() {
  centerCount.classList.add('bump');
  setTimeout(() => centerCount.classList.remove('bump'), 160);
}

/* ── Tap logic ──────────────────────────────────────────── */
function doTap() {
  if (animating) return;
  const d = adhkar[dhikrIndex];

  tapBtn.classList.add('pressed');
  setTimeout(() => tapBtn.classList.remove('pressed'), 130);

  count++;
  updateBeads();
  centerCount.textContent = count + ' / ' + d.target;
  bumpCount();

  if (count >= d.target) {
    animating = true;

    // Show celebration
    setTimeout(() => {
      celebTitle.textContent  = 'Voltooid';
      celebArabic.textContent = d.arabic;
      celebSub.textContent    = d.target + '× ' + d.label;
      celebration.classList.add('show');

      setTimeout(() => {
        celebration.classList.remove('show');

        // Next dhikr
        dhikrIndex = (dhikrIndex + 1) % adhkar.length;
        count = adhkar[dhikrIndex].startAt;

        updateSelector(dhikrIndex);
        buildBeads();
        updateBeads();
        updateCenter(adhkar[dhikrIndex]);

        setTimeout(() => { animating = false; }, 300);
      }, 1600);
    }, 200);
  }
}

/* ── Auto-play ──────────────────────────────────────────── */
function scheduleNext() {
  const d = adhkar[dhikrIndex];
  const remaining = d.target - count;
  const delay = remaining <= 4 ? 650 : 850;
  return setTimeout(() => {
    doTap();
    timeoutId = scheduleNext();
  }, delay);
}

/* ── Init ───────────────────────────────────────────────── */
buildBeads();
updateBeads();
updateCenter(adhkar[0]);

let timeoutId;
setTimeout(() => { timeoutId = scheduleNext(); }, 1000);
</script>
</body>
</html>
